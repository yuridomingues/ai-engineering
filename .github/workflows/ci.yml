name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test workflow library
        run: npm run harness:test
      - name: Validate workflow DAGs
        run: npm run workflow:check
      - name: Validate toolkit structure
        run: npm run doctor:self
      - name: Smoke-test installer
        run: |
          rm -rf /tmp/ai-engineering-kit
          node scripts/install.mjs /tmp/ai-engineering-kit --all
          node scripts/doctor.mjs /tmp/ai-engineering-kit
          node /tmp/ai-engineering-kit/.ai/harness/workflow.mjs check /tmp/ai-engineering-kit/.ai/workflows/feature.json

  mcp-starter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/starter-typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
