name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check harness scripts
        run: |
          for file in scripts/*.mjs; do
            node --check "$file"
          done

      - name: Validate toolkit structure
        run: node scripts/doctor.mjs .

      - name: Validate task DAG
        run: node scripts/taskgraph.mjs validate orchestration/example.taskgraph.json

      - name: Validate reusable engineering playbooks
        run: |
          for graph in orchestration/playbooks/*.json; do
            node scripts/taskgraph.mjs validate "$graph"
          done

      - name: Smoke-test playbook instantiation
        run: |
          rm -rf .agent/playbook-smoke
          node scripts/playbook.mjs init bugfix --name ci-bugfix --out .agent/playbook-smoke/bugfix.json
          node scripts/taskgraph.mjs validate .agent/playbook-smoke/bugfix.json

      - name: Check agent readiness
        run: node scripts/repo-readiness.mjs . --strict 70

      - name: Self-test architecture boundaries
        run: node scripts/architecture-lint.mjs configs/architecture.layers.selftest.json

  mcp-starter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/starter-typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
